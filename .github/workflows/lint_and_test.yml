name: Perform linting and run tests

on:
  # Runs on every branch so a fix can be tested before it reaches master.
  # master itself is tested by build_and_release.yml (which calls this file) so
  # it's excluded here to avoid running the suite twice.
  push:
    branches-ignore:
      - master
    tags-ignore:
      - '**'
  pull_request:
    branches:
      - master
  workflow_dispatch:
  # Lets build_and_release.yml run the full test suite before publishing an image
  workflow_call:

jobs:
  build-and-test:
    name: Build, Lint, and Test
    runs-on: ubuntu-latest
    if: "! contains(toJSON(github.event.commits.*.message), '[skip ci]')"
    env:
      COMPOSE_FILE: ./docker-compose.ci.yml
      MIX_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull prebuilt images
        run: docker compose pull

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/dev.Dockerfile
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Docker image
        run: docker compose up --detach

      # NOTE: All exec commands use the -T flag to compensate for
      # a bug in the GitHub Actions runner where its stdin/stderr
      # will erroneously report that it's a TTY.
      # Aside from handling this bug the -T flag is not required
      # See https://github.com/actions/runner/issues/241 and https://github.com/docker/compose/issues/8537
      - name: Install Elixir and JS deps
        run: |
          docker compose exec -T phx mix deps.get && yarn install && cd assets && yarn install && cd ..

      - name: Create and Migrate database
        run: |
          docker compose exec -T phx mix ecto.create
          docker compose exec -T phx mix ecto.migrate

      # Same checks as `mix check` (tooling/.check.exs), split into steps so it's obvious
      # which one failed. A failing step posts its last output lines as an annotation.
      - name: Write check helper
        run: |
          cat > "$RUNNER_TEMP/run_check.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          title="$1"; shift
          out="$(mktemp)"
          if "$@" >"$out" 2>&1; then
            tail -n 5 "$out"
            exit 0
          fi
          cat "$out"
          # Encode newlines so the whole tail lands in a single annotation
          msg="$(tail -n 80 "$out" | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}')"
          echo "::error title=${title} failed::${msg}"
          exit 1
          SCRIPT
          chmod +x "$RUNNER_TEMP/run_check.sh"

      - name: Compile (warnings are errors)
        if: success() || failure()
        run: |
          "$RUNNER_TEMP/run_check.sh" "Compile" docker compose exec -T phx mix compile --warnings-as-errors --force

      - name: Elixir formatting
        if: success() || failure()
        run: |
          "$RUNNER_TEMP/run_check.sh" "Elixir formatting" docker compose exec -T phx mix format --check-formatted

      - name: Prettier formatting
        if: success() || failure()
        run: |
          "$RUNNER_TEMP/run_check.sh" "Prettier formatting" yarn run lint:check

      - name: Credo
        if: success() || failure()
        run: |
          "$RUNNER_TEMP/run_check.sh" "Credo" docker compose exec -T phx mix credo

      - name: Sobelow (security)
        if: success() || failure()
        run: |
          "$RUNNER_TEMP/run_check.sh" "Sobelow" docker compose exec -T phx mix sobelow --config

      - name: Tests
        if: success() || failure()
        run: |
          "$RUNNER_TEMP/run_check.sh" "Tests" docker compose exec -T -e EX_CHECK=1 phx mix test
