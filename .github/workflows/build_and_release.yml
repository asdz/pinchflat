name: Build, Smoke Test, and Publish

# An image only gets the `edge` or `stable` tag after:
#   1. the full test suite passes (lint_and_test.yml), and
#   2. the built image survives a fresh install, an upgrade from upstream's
#      image, and a rollback (tooling/smoke_test.sh).
#
# Tags published to ghcr.io/<owner>/pinchflat:
#   sha-<commit>   every build that passed tests. Use these to roll back to an exact build
#   edge           latest master that passed everything
#   stable         latest `v*` git tag that passed everything (point the NAS at this)
#   v<version>     the release itself, eg: v2026.10.18
#
# Only GITHUB_TOKEN is used. Never add cookies, API keys or passwords to this repo:
# it's public, and so are its Action logs.

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  # Weekly rebuild of master so `edge` picks up fresh yt-dlp, Deno and OS security fixes
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      platforms:
        type: choice
        description: 'Build platforms'
        required: true
        default: 'linux/amd64'
        options:
          - 'linux/amd64'
          - 'linux/amd64,linux/arm64'

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Synology NASes are almost all amd64. Set this repo variable to 'linux/amd64,linux/arm64' for ARM models
  DEFAULT_PLATFORMS: ${{ vars.IMAGE_PLATFORMS || 'linux/amd64' }}

jobs:
  secret_scan:
    name: Scan for leaked credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run gitleaks over the source tree
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            dir /repo --config /repo/.gitleaks.toml --redact --no-banner \
            --report-format json --report-path /repo/gitleaks-report.json --exit-code 0
          count="$(jq length gitleaks-report.json)"
          # One annotation per finding (rule, file, line - never the secret itself)
          jq -r '.[] | "::error file=\(.File | sub("^/repo/"; "")),line=\(.StartLine)::gitleaks rule \(.RuleID)"' gitleaks-report.json
          echo "gitleaks findings: $count"
          [ "$count" -eq 0 ]

  test:
    name: Test suite
    uses: ./.github/workflows/lint_and_test.yml

  build:
    name: Build image
    needs: [secret_scan, test]
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.vars.outputs.image }}
      sha_tag: ${{ steps.vars.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out image name and tag
        id: vars
        run: |
          # ghcr requires lowercase names
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push sha tag
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/selfhosted.Dockerfile
          platforms: ${{ inputs.platforms || env.DEFAULT_PLATFORMS }}
          push: true
          tags: ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke_test:
    name: Fresh install, upgrade and rollback
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Upgrade from upstream's last release
        run: tooling/smoke_test.sh "${{ needs.build.outputs.image }}:${{ needs.build.outputs.sha_tag }}" ghcr.io/kieraneglin/pinchflat:latest

      - name: Upgrade from our own current stable (if one exists yet)
        run: |
          stable="${{ needs.build.outputs.image }}:stable"
          if docker manifest inspect "$stable" >/dev/null 2>&1; then
            tooling/smoke_test.sh "${{ needs.build.outputs.image }}:${{ needs.build.outputs.sha_tag }}" "$stable"
          else
            echo "No stable tag yet, skipping"
          fi

  publish:
    name: Publish tags
    needs: [build, smoke_test]
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point edge/stable at the tested image
        run: |
          image="${{ needs.build.outputs.image }}"
          src="$image:${{ needs.build.outputs.sha_tag }}"
          tags=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tags+=(-t "$image:${GITHUB_REF_NAME}" -t "$image:stable")
          else
            tags+=(-t "$image:edge")
          fi
          # Retags the already-tested manifest; nothing is rebuilt
          docker buildx imagetools create "${tags[@]}" "$src"
          echo "Published ${tags[*]} -> $src" >> "$GITHUB_STEP_SUMMARY"
